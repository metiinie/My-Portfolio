<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120d09"/>
      <stop offset="100%" stop-color="#24140b"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#321a0f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1d0f09" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad5)"/>
  <circle cx="280" cy="220" r="170" fill="#f59e0b" opacity="0.1" filter="url(#glowAmber)"/>
  <circle cx="1020" cy="450" r="200" fill="#ea580c" opacity="0.1" filter="url(#glowAmber)"/>

  <!-- Top App Header -->
  <rect x="80" y="50" width="1120" height="70" rx="16" fill="url(#cardGrad5)" stroke="#532915" stroke-width="1.5"/>
  <circle cx="120" cy="85" r="8" fill="#f59e0b"/>
  <circle cx="145" cy="85" r="8" fill="#ea580c"/>
  <circle cx="170" cy="85" r="8" fill="#10b981"/>
  <text x="210" y="92" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="20" font-weight="700">ArifSmart Menu &amp; Safeland Cafe</text>
  <text x="530" y="92" fill="#fde68a" font-family="system-ui, sans-serif" font-size="16">QR-Based Restaurant Ordering &amp; Kitchen Coordination</text>

  <rect x="990" y="68" width="180" height="34" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="1012" cy="85" r="5" fill="#f59e0b"/>
  <text x="1028" y="91" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Product Exploration</text>

  <!-- Left: QR Ordering Mobile View -->
  <g transform="translate(130, 150)">
    <rect x="0" y="0" width="280" height="520" rx="36" fill="#140a05" stroke="#78350f" stroke-width="2.5"/>
    <rect x="15" y="45" width="250" height="455" rx="24" fill="#200f07"/>

    <!-- Table context header -->
    <rect x="25" y="60" width="230" height="50" rx="10" fill="#3c1a0c"/>
    <text x="40" y="82" fill="#fde68a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Safeland Cafe • Table #08</text>
    <text x="40" y="100" fill="#d97706" font-family="system-ui, sans-serif" font-size="11">Addis Ababa • Session Active (Live)</text>

    <!-- Menu Items -->
    <g transform="translate(25, 125)">
      <rect x="0" y="0" width="230" height="65" rx="8" fill="#2d1308" stroke="#451a03"/>
      <text x="15" y="25" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Special Ethiopian Coffee Set</text>
      <text x="15" y="45" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ETB 180.00</text>
      <rect x="180" y="20" width="38" height="26" rx="6" fill="#f59e0b"/>
      <text x="194" y="38" fill="#451a03" font-size="16" font-weight="700">+</text>

      <rect x="0" y="75" width="230" height="65" rx="8" fill="#2d1308" stroke="#451a03"/>
      <text x="15" y="100" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Avocado &amp; Chicken Wrap</text>
      <text x="15" y="120" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ETB 450.00</text>
      <rect x="180" y="95" width="38" height="26" rx="6" fill="#f59e0b"/>
      <text x="194" y="113" fill="#451a03" font-size="16" font-weight="700">+</text>

      <rect x="0" y="150" width="230" height="65" rx="8" fill="#2d1308" stroke="#451a03"/>
      <text x="15" y="175" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Fresh Mango &amp; Passion Juice</text>
      <text x="15" y="195" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ETB 220.00</text>
      <rect x="180" y="170" width="38" height="26" rx="6" fill="#f59e0b"/>
      <text x="194" y="188" fill="#451a03" font-size="16" font-weight="700">+</text>
    </g>

    <rect x="25" y="390" width="230" height="85" rx="10" fill="#3c1a0c" stroke="#f59e0b" stroke-width="1"/>
    <text x="40" y="415" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Order Placed: #ORD-519</text>
    <text x="40" y="435" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11">Status: Kitchen Preparing (Kanban)</text>
    <rect x="40" y="445" width="200" height="18" rx="4" fill="#f59e0b" fill-opacity="0.3"/>
    <rect x="40" y="445" width="120" height="18" rx="4" fill="#f59e0b"/>
    <text x="140" y="458" text-anchor="middle" fill="#451a03" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Step 2 of 3 (In Oven)</text>
  </g>

  <!-- Right: Kitchen Kanban Flow & Hierarchy Architecture -->
  <g transform="translate(460, 150)">
    <rect x="0" y="0" width="740" height="520" rx="18" fill="url(#cardGrad5)" stroke="#532915" stroke-width="1.5"/>

    <text x="35" y="45" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Operational Hierarchy &amp; Real-Time Coordination</text>
    <text x="35" y="70" fill="#fde68a" font-family="system-ui, sans-serif" font-size="14">Restaurant Organization → Branch → Table Sessions → Kitchen Kanban Queue</text>

    <!-- 3-Column Kanban Board -->
    <g transform="translate(35, 95)">
      <!-- Col 1: Incoming Orders -->
      <rect x="0" y="0" width="215" height="380" rx="10" fill="#1b0c06" stroke="#532915"/>
      <rect x="0" y="0" width="215" height="40" rx="10" fill="#2d1308"/>
      <text x="15" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">QUEUED (3)</text>
      
      <!-- Card A -->
      <rect x="10" y="55" width="195" height="95" rx="8" fill="#38180a" stroke="#78350f"/>
      <text x="20" y="78" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Table 12 • #521</text>
      <text x="20" y="98" fill="#d97706" font-family="system-ui, sans-serif" font-size="11">2x Burger, 1x Fries</text>
      <rect x="20" y="112" width="70" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="26" y="126" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Just Now</text>

      <!-- Card B -->
      <rect x="10" y="165" width="195" height="95" rx="8" fill="#38180a" stroke="#78350f"/>
      <text x="20" y="188" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Table 03 • #522</text>
      <text x="20" y="208" fill="#d97706" font-family="system-ui, sans-serif" font-size="11">3x Macchiato</text>
      <rect x="20" y="222" width="70" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="26" y="236" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">1m ago</text>

      <!-- Col 2: Preparing In Kitchen -->
      <rect x="235" y="0" width="215" height="380" rx="10" fill="#1b0c06" stroke="#532915"/>
      <rect x="235" y="0" width="215" height="40" rx="10" fill="#2d1308"/>
      <text x="250" y="26" fill="#ea580c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PREPARING (2)</text>
      
      <rect x="245" y="55" width="195" height="95" rx="8" fill="#38180a" stroke="#ea580c"/>
      <text x="255" y="78" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Table 08 • #519</text>
      <text x="255" y="98" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11">Coffee Set, Chicken Wrap</text>
      <rect x="255" y="112" width="80" height="20" rx="4" fill="#ea580c"/>
      <text x="263" y="126" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Station Chef A</text>

      <!-- Col 3: Ready for Table Delivery -->
      <rect x="470" y="0" width="215" height="380" rx="10" fill="#1b0c06" stroke="#532915"/>
      <rect x="470" y="0" width="215" height="40" rx="10" fill="#2d1308"/>
      <text x="485" y="26" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">READY (4)</text>
      
      <rect x="480" y="55" width="195" height="95" rx="8" fill="#122a1f" stroke="#059669"/>
      <text x="490" y="78" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Table 05 • #517</text>
      <text x="490" y="98" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Special Pizza, Soft Drinks</text>
      <rect x="490" y="112" width="85" height="20" rx="4" fill="#10b981"/>
      <text x="498" y="126" fill="#064e3b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SERVE NOW</text>
    </g>
  </g>
</svg>
