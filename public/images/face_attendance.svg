<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>
    <linearGradient id="aiCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191c33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0e1022" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#aiBg)"/>

  <!-- Matrix / Mesh Lines -->
  <g opacity="0.06" stroke="#818cf8" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Glows -->
  <circle cx="280" cy="260" r="170" fill="#38bdf8" opacity="0.12" filter="url(#aiGlow)"/>
  <circle cx="1000" cy="480" r="180" fill="#c084fc" opacity="0.1" filter="url(#aiGlow)"/>

  <!-- Top App Navigation -->
  <rect x="70" y="50" width="1140" height="68" rx="14" fill="url(#aiCard)" stroke="#312e81" stroke-width="1.2"/>
  <circle cx="106" cy="84" r="7" fill="#ef4444"/>
  <circle cx="128" cy="84" r="7" fill="#f59e0b"/>
  <circle cx="150" cy="84" r="7" fill="#10b981"/>

  <text x="185" y="90" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">BIOMETRIC ATTENDANCE AI</text>
  <rect x="500" y="73" width="190" height="24" rx="12" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.4"/>
  <text x="595" y="89" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PYTHON &bull; OPENCV &bull; VISION</text>
  <text x="705" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Automated Facial Recognition &amp; Anti-Fraud Dashboard</text>

  <!-- Left Column: Biometric Recognition Video Feed & Landmarks -->
  <g transform="translate(70, 140)">
    <rect width="640" height="520" rx="16" fill="url(#aiCard)" stroke="#312e81" stroke-width="1.2"/>

    <!-- Camera Viewfinder -->
    <rect x="24" y="24" width="592" height="300" rx="12" fill="#070913" stroke="#1e1b4b"/>

    <!-- Scan Line Effect -->
    <line x1="24" y1="160" x2="616" y2="160" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>

    <!-- Center Face Bounding Box & Target Mesh -->
    <g transform="translate(320, 160)">
      <!-- Corner targeting brackets -->
      <path d="M -90 -90 L -60 -90 M -90 -90 L -90 -60" stroke="#38bdf8" stroke-width="3" fill="none"/>
      <path d="M 90 -90 L 60 -90 M 90 -90 L 90 -60" stroke="#38bdf8" stroke-width="3" fill="none"/>
      <path d="M -90 90 L -60 90 M -90 90 L -90 60" stroke="#38bdf8" stroke-width="3" fill="none"/>
      <path d="M 90 90 L 60 90 M 90 90 L 90 60" stroke="#38bdf8" stroke-width="3" fill="none"/>

      <!-- Facial landmarks mesh -->
      <ellipse cx="0" cy="0" rx="60" ry="75" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="4 4" fill="none" opacity="0.4"/>
      <!-- Eyes points -->
      <circle cx="-25" cy="-18" r="4" fill="#38bdf8"/>
      <circle cx="25" cy="-18" r="4" fill="#38bdf8"/>
      <!-- Nose bridge -->
      <line x1="0" y1="-10" x2="0" y2="12" stroke="#818cf8" stroke-width="1.5"/>
      <!-- Mouth line -->
      <path d="M -20 32 Q 0 40 20 32" stroke="#818cf8" stroke-width="2" fill="none"/>

      <!-- Recognition Tag -->
      <rect x="-85" y="-125" width="170" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="0" y="-107" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">EMPLOYEE ID #EMP-1049 &bull; 99.4%</text>
    </g>

    <!-- Overlay Stats -->
    <rect x="40" y="40" width="160" height="36" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <circle cx="56" cy="58" r="5" fill="#10b981"/>
    <text x="70" y="62" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">LIVE FEED &bull; 60 FPS</text>

    <!-- Live Details -->
    <g transform="translate(24, 345)">
      <text x="0" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Automated Identification &amp; Attendance Logging</text>
      <text x="0" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Identifies registered personnel, checks timestamp against schedule, flags proxy sign-ins.</text>

      <g transform="translate(0, 68)">
        <rect x="0" y="0" width="138" height="58" rx="8" fill="#0f172a" stroke="#312e81"/>
        <text x="14" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">MATCH LATENCY</text>
        <text x="14" y="44" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="800">42 ms</text>

        <rect x="150" y="0" width="138" height="58" rx="8" fill="#0f172a" stroke="#312e81"/>
        <text x="164" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">LIVENESS CHECK</text>
        <text x="164" y="44" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="800">ACTIVE</text>

        <rect x="300" y="0" width="138" height="58" rx="8" fill="#0f172a" stroke="#312e81"/>
        <text x="314" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">ATTENDANCE FRAUD</text>
        <text x="314" y="44" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="18" font-weight="800">0.00%</text>

        <rect x="450" y="0" width="142" height="58" rx="8" fill="#0f172a" stroke="#312e81"/>
        <text x="464" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">ENROLLED BASE</text>
        <text x="464" y="44" fill="#c084fc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">1,250 Staff</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Administrative Dashboard & Log Feed -->
  <g transform="translate(735, 140)">
    <rect width="475" height="520" rx="16" fill="url(#aiCard)" stroke="#312e81" stroke-width="1.2"/>

    <text x="24" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Administrative Monitoring &amp; Reports</text>
    <text x="24" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Real-time Clock-In &bull; Shift Logs &bull; Exportable Analytics</text>

    <!-- Recent Auto-Clock Ins -->
    <g transform="translate(24, 85)">
      <!-- Item 1 -->
      <rect width="425" height="68" rx="8" fill="#070913" stroke="#1e1b4b"/>
      <circle cx="34" cy="34" r="16" fill="#10b981" fill-opacity="0.2"/>
      <text x="34" y="39" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">✓</text>
      <text x="64" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Mekonnen T. &bull; Engineering Lead</text>
      <text x="64" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Clock-in: 08:29:12 AM &bull; On Time &bull; Gate A Camera</text>
      <text x="405" y="38" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">PRESENT</text>
    </g>

    <g transform="translate(24, 165)">
      <!-- Item 2 -->
      <rect width="425" height="68" rx="8" fill="#070913" stroke="#1e1b4b"/>
      <circle cx="34" cy="34" r="16" fill="#10b981" fill-opacity="0.2"/>
      <text x="34" y="39" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">✓</text>
      <text x="64" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Selamawit A. &bull; Operations Director</text>
      <text x="64" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Clock-in: 08:34:05 AM &bull; On Time &bull; Lobby Main</text>
      <text x="405" y="38" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">PRESENT</text>
    </g>

    <g transform="translate(24, 245)">
      <!-- Item 3 -->
      <rect width="425" height="68" rx="8" fill="#070913" stroke="#1e1b4b"/>
      <circle cx="34" cy="34" r="16" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="34" y="39" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">⚡</text>
      <text x="64" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Yohannes K. &bull; Logistics Officer</text>
      <text x="64" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Clock-in: 08:47:30 AM &bull; Shift B &bull; Warehouse Gate</text>
      <text x="405" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">LOGGED</text>
    </g>

    <!-- Stack summary card -->
    <g transform="translate(24, 345)">
      <rect width="425" height="150" rx="12" fill="url(#aiGrad)" fill-opacity="0.1" stroke="#818cf8" stroke-width="1.2"/>
      <text x="20" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Computer Vision &amp; Architecture</text>
      <text x="20" y="56" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">&bull; Python &amp; OpenCV facial landmark extraction</text>
      <text x="20" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">&bull; 128-dimensional embedding generation with dlib/face_recognition</text>
      <text x="20" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">&bull; Anti-spoofing texture analysis &amp; automated database logging</text>
      <text x="20" y="128" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Engineered by Awol Ibrahim Ayalew</text>
    </g>
  </g>
</svg>
