<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#141c2b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2438" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#101726" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Glow orb -->
  <circle cx="950" cy="240" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Top App Header -->
  <rect x="80" y="60" width="1120" height="70" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="120" cy="95" r="8" fill="#ef4444"/>
  <circle cx="145" cy="95" r="8" fill="#f59e0b"/>
  <circle cx="170" cy="95" r="8" fill="#10b981"/>
  <text x="210" y="102" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">ICAMS / Denb</text>
  <text x="360" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16">Code Enforcement &amp; Municipal Case Management</text>
  
  <!-- Offline Sync Badge -->
  <rect x="1000" y="78" width="170" height="34" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <circle cx="1022" cy="95" r="5" fill="#10b981"/>
  <text x="1038" y="101" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="600">PWA • Dexie Offline</text>

  <!-- Left Sidebar Navigation Mockup -->
  <rect x="80" y="150" width="260" height="510" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="195" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">NAVIGATION</text>
  
  <rect x="100" y="215" width="220" height="42" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="125" y="242" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">📋 Active Cases (142)</text>
  
  <text x="125" y="295" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">📍 Field Inspection Map</text>
  <text x="125" y="345" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">🚨 Anonymous Tips</text>
  <text x="125" y="395" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">⚖️ Enforcement Decisions</text>
  <text x="125" y="445" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">⚙️ Role Permissions</text>
  <text x="125" y="495" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">📊 Monthly Analytics</text>

  <!-- Main Content Dashboard -->
  <rect x="360" y="150" width="840" height="510" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Stats Row -->
  <g transform="translate(390, 180)">
    <rect x="0" y="0" width="240" height="90" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="35" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Total Inquiries</text>
    <text x="20" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="700">1,284</text>
    <text x="130" y="70" fill="#10b981" font-family="system-ui, sans-serif" font-size="13">↑ +18% sync</text>

    <rect x="260" y="0" width="240" height="90" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="280" y="35" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Field Reports</text>
    <text x="280" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="700">542</text>
    <text x="375" y="70" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Offline ready</text>

    <rect x="520" y="0" width="240" height="90" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="540" y="35" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Enforcement Rate</text>
    <text x="540" y="70" fill="#a855f7" font-family="system-ui, sans-serif" font-size="28" font-weight="700">94.2%</text>
    <text x="660" y="70" fill="#10b981" font-family="system-ui, sans-serif" font-size="13">Filament</text>
  </g>

  <!-- Case Table Mockup -->
  <g transform="translate(390, 300)">
    <rect x="0" y="0" width="780" height="330" rx="12" fill="#0b1120" stroke="#1e293b"/>
    
    <text x="25" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Recent Municipal Case Lifecycles</text>
    
    <!-- Table Headers -->
    <line x1="20" y1="55" x2="760" y2="55" stroke="#334155" stroke-width="1"/>
    <text x="25" y="80" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600">CASE ID</text>
    <text x="140" y="80" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600">MUNICIPAL ZONE</text>
    <text x="310" y="80" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600">STATUS</text>
    <text x="490" y="80" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600">STORAGE LAYER</text>
    <text x="660" y="80" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ACTIONS</text>
    
    <!-- Row 1 -->
    <line x1="20" y1="100" x2="760" y2="100" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="130" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="500">#DNB-8421</text>
    <text x="140" y="130" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Bole Sub-City (Commercial)</text>
    <rect x="310" y="112" width="110" height="26" rx="6" fill="#10b981" fill-opacity="0.15"/>
    <text x="325" y="129" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">COMPLIANT</text>
    <text x="490" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">Dexie.js Cache</text>
    <text x="660" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Review →</text>

    <!-- Row 2 -->
    <line x1="20" y1="155" x2="760" y2="155" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="500">#DNB-8422</text>
    <text x="140" y="185" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Yeka Zone (Zoning Permit)</text>
    <rect x="310" y="167" width="125" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="325" y="184" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">INSPECTION DUE</text>
    <text x="490" y="185" fill="#a855f7" font-family="system-ui, sans-serif" font-size="13">Laravel Filament</text>
    <text x="660" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Review →</text>

    <!-- Row 3 -->
    <line x1="20" y1="210" x2="760" y2="210" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="240" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="500">#DNB-8423</text>
    <text x="140" y="240" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Kirkos (Anonymous Report)</text>
    <rect x="310" y="222" width="120" height="26" rx="6" fill="#6366f1" fill-opacity="0.15"/>
    <text x="325" y="239" fill="#6366f1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ANON SECURE</text>
    <text x="490" y="240" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">IndexedDB Sync</text>
    <text x="660" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Review →</text>

    <!-- Row 4 -->
    <line x1="20" y1="265" x2="760" y2="265" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="295" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="500">#DNB-8424</text>
    <text x="140" y="295" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Arada District (Safety Code)</text>
    <rect x="310" y="277" width="110" height="26" rx="6" fill="#ec4899" fill-opacity="0.15"/>
    <text x="325" y="294" fill="#ec4899" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ACTION REQ</text>
    <text x="490" y="295" fill="#10b981" font-family="system-ui, sans-serif" font-size="13">MySQL Cluster</text>
    <text x="660" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Review →</text>
  </g>
</svg>
