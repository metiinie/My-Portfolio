<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="100%" stop-color="#191928"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212035" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#141324" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad4)"/>
  <circle cx="280" cy="220" r="170" fill="#f97316" opacity="0.1" filter="url(#glowOrange)"/>
  <circle cx="1020" cy="450" r="200" fill="#6366f1" opacity="0.1" filter="url(#glowOrange)"/>

  <!-- Top App Header -->
  <rect x="80" y="50" width="1120" height="70" rx="16" fill="url(#cardGrad4)" stroke="#32314d" stroke-width="1.5"/>
  <circle cx="120" cy="85" r="8" fill="#f97316"/>
  <circle cx="145" cy="85" r="8" fill="#eab308"/>
  <circle cx="170" cy="85" r="8" fill="#10b981"/>
  <text x="210" y="92" fill="#fafaf9" font-family="system-ui, sans-serif" font-size="20" font-weight="700">DU Verifay</text>
  <text x="330" y="92" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="16">Receipt Extraction &amp; Verification Pipeline</text>

  <rect x="970" y="68" width="200" height="34" rx="8" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1"/>
  <circle cx="992" cy="85" r="5" fill="#f97316"/>
  <text x="1008" y="91" fill="#fafaf9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Product Exploration</text>

  <!-- Left: Mobile Payment Confirmation Screenshot Simulation -->
  <g transform="translate(130, 150)">
    <rect x="0" y="0" width="300" height="520" rx="36" fill="#0d0d16" stroke="#4338ca" stroke-width="2.5"/>
    <rect x="15" y="45" width="270" height="455" rx="24" fill="#151424"/>

    <!-- Telebirr / CBE style confirmation banner -->
    <rect x="35" y="70" width="230" height="90" rx="14" fill="#047857"/>
    <circle cx="65" cy="115" r="18" fill="#ffffff" fill-opacity="0.2"/>
    <text x="58" y="122" fill="#ffffff" font-size="20">✓</text>
    <text x="95" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Payment Transferred</text>
    <text x="95" y="128" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="18" font-weight="800">ETB 14,250.00</text>

    <!-- Extracted OCR Fields -->
    <g transform="translate(35, 180)">
      <rect x="0" y="0" width="230" height="45" rx="8" fill="#1e1c33" stroke="#f97316" stroke-width="1.5"/>
      <text x="12" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">TXN REFERENCE ID</text>
      <text x="12" y="36" fill="#fb923c" font-family="monospace" font-size="13" font-weight="700">FT26291992019A</text>

      <rect x="0" y="55" width="230" height="45" rx="8" fill="#1e1c33" stroke="#334155"/>
      <text x="12" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">PAYER ACCOUNT</text>
      <text x="12" y="91" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">1000****4928</text>

      <rect x="0" y="110" width="230" height="45" rx="8" fill="#1e1c33" stroke="#334155"/>
      <text x="12" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">TIMESTAMP</text>
      <text x="12" y="146" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">2026-10-24 14:18:02</text>

      <rect x="0" y="165" width="230" height="45" rx="8" fill="#1e1c33" stroke="#10b981" stroke-width="1.5"/>
      <text x="12" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">PAYMENT STATUS</text>
      <text x="12" y="201" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">CONFIRMED (OCR EXTRACTED)</text>
    </g>

    <rect x="35" y="440" width="230" height="40" rx="8" fill="#f97316"/>
    <text x="150" y="465" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Parse &amp; Audit Receipt</text>
  </g>

  <!-- Right: Verification Rigor & Engineering Judgment -->
  <g transform="translate(480, 150)">
    <rect x="0" y="0" width="720" height="520" rx="18" fill="url(#cardGrad4)" stroke="#32314d" stroke-width="1.5"/>

    <text x="40" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Engineering Judgment: Extraction vs. Authoritative Proof</text>
    <text x="40" y="70" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="14">Applied AI extracts data from screenshots; true verification requires trusted payment data sources.</text>

    <!-- Comparison Matrix -->
    <g transform="translate(40, 95)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="310" height="230" rx="12" fill="#161526" stroke="#f97316" stroke-width="1"/>
      <text x="20" y="32" fill="#fb923c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Stage 1: AI &amp; OCR Extraction</text>
      <text x="20" y="60" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Parses transaction reference number</text>
      <text x="20" y="85" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Extracts transferred amount &amp; date</text>
      <text x="20" y="110" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Detects visual font/layout anomalies</text>
      <text x="20" y="135" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Flags potential tampering or edits</text>
      <rect x="20" y="170" width="270" height="35" rx="6" fill="#f97316" fill-opacity="0.15"/>
      <text x="35" y="192" fill="#fdba74" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Assists human audit speed</text>

      <!-- Box 2 -->
      <rect x="330" y="0" width="310" height="230" rx="12" fill="#161526" stroke="#10b981" stroke-width="1"/>
      <text x="350" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Stage 2: Provider Verification</text>
      <text x="350" y="60" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Reconciles reference with bank API</text>
      <text x="350" y="85" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Checks account ledger credits</text>
      <text x="350" y="110" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Guarantees zero double-spending</text>
      <text x="350" y="135" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Writes immutable verification audit</text>
      <rect x="350" y="170" width="270" height="35" rx="6" fill="#10b981" fill-opacity="0.15"/>
      <text x="365" y="192" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Authoritative source of truth</text>
    </g>

    <!-- Bottom summary box -->
    <rect x="40" y="350" width="640" height="135" rx="12" fill="#121120" stroke="#2c2a47"/>
    <text x="60" y="380" fill="#fafaf9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Why this distinction matters for engineering:</text>
    <text x="60" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">"Extracting fields from a screenshot is not equivalent to proving payment was received. Showing this difference reflects real-world engineering judgment rather than tech hype."</text>
    <text x="60" y="435" fill="#fb923c" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Technologies: Python · OpenCV · Tesseract OCR · Pydantic · REST APIs</text>
    <text x="60" y="460" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Status: Product Exploration &amp; Prototype Stage</text>
  </g>
</svg>
