<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1319"/>
      <stop offset="100%" stop-color="#141e28"/>
    </linearGradient>
    <linearGradient id="foodCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182736" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f1924" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="foodAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="foodGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#foodBg)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="260" cy="240" r="170" fill="#0ea5e9" opacity="0.12" filter="url(#foodGlow)"/>
  <circle cx="1020" cy="480" r="180" fill="#10b981" opacity="0.1" filter="url(#foodGlow)"/>

  <!-- Top App Navigation -->
  <rect x="70" y="50" width="1140" height="68" rx="14" fill="url(#foodCard)" stroke="#1e3a50" stroke-width="1.2"/>
  <circle cx="106" cy="84" r="7" fill="#ef4444"/>
  <circle cx="128" cy="84" r="7" fill="#f59e0b"/>
  <circle cx="150" cy="84" r="7" fill="#10b981"/>

  <text x="185" y="90" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">MULTI-VENDOR FOOD DISPATCH</text>
  <rect x="520" y="73" width="180" height="24" rx="12" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-opacity="0.4"/>
  <text x="610" y="89" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">REAL-TIME MULTI-ROLE</text>
  <text x="720" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Customers &bull; Courier Drivers &bull; Restaurant Kitchens</text>

  <!-- Left Column: Courier Route & Live Tracking Map -->
  <g transform="translate(70, 140)">
    <rect width="640" height="520" rx="16" fill="url(#foodCard)" stroke="#1e3a50" stroke-width="1.2"/>

    <!-- Map Canvas Mockup -->
    <rect x="24" y="24" width="592" height="280" rx="12" fill="#081017" stroke="#162939"/>
    
    <!-- Delivery route path -->
    <path d="M 60 220 C 140 220 180 120 280 140 S 440 240 540 80" stroke="#0ea5e9" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 60 220 C 140 220 180 120 280 140 S 440 240 540 80" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" fill="none"/>

    <!-- Restaurant Pin -->
    <g transform="translate(60, 220)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b"/>
      <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">🍳</text>
      <rect x="-45" y="22" width="90" height="20" rx="4" fill="#0f1924" stroke="#f59e0b" stroke-width="1"/>
      <text x="0" y="36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">RESTAURANT</text>
    </g>

    <!-- Courier Live Pin (Moving) -->
    <g transform="translate(280, 140)">
      <circle cx="0" cy="0" r="24" fill="#0ea5e9" opacity="0.3"/>
      <circle cx="0" cy="0" r="14" fill="#0284c7"/>
      <text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">🛵</text>
      <rect x="-65" y="-36" width="130" height="24" rx="6" fill="#0f1924" stroke="#38bdf8" stroke-width="1"/>
      <text x="0" y="-20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">DRIVER (8 MINS AWAY)</text>
    </g>

    <!-- Customer Destination Pin -->
    <g transform="translate(540, 80)">
      <circle cx="0" cy="0" r="16" fill="#10b981"/>
      <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">📍</text>
      <rect x="-40" y="22" width="80" height="20" rx="4" fill="#0f1924" stroke="#10b981" stroke-width="1"/>
      <text x="0" y="36" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CUSTOMER</text>
    </g>

    <!-- Dispatch Lifecycle Details -->
    <g transform="translate(24, 325)">
      <text x="0" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Multi-Role Order Orchestration</text>
      <text x="0" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Centralized Redux Toolkit state machine synchronizing customer, courier &amp; restaurant.</text>

      <g transform="translate(0, 68)">
        <rect x="0" y="0" width="138" height="60" rx="8" fill="#0b1319" stroke="#162939"/>
        <text x="14" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">01. ORDER PLACED</text>
        <text x="14" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Kitchen Alerted</text>

        <rect x="150" y="0" width="138" height="60" rx="8" fill="#0b1319" stroke="#162939"/>
        <text x="164" y="22" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">02. FOOD PREPARED</text>
        <text x="164" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Courier Dispatched</text>

        <rect x="300" y="0" width="138" height="60" rx="8" fill="#0b1319" stroke="#162939"/>
        <text x="314" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">03. ON ROUTE</text>
        <text x="314" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Live GPS Polling</text>

        <rect x="450" y="0" width="142" height="60" rx="8" fill="#0b1319" stroke="#162939"/>
        <text x="464" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">04. DELIVERED</text>
        <text x="464" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Handshake PIN OK</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Courier App & Cloud Functions -->
  <g transform="translate(735, 140)">
    <rect width="475" height="520" rx="16" fill="url(#foodCard)" stroke="#1e3a50" stroke-width="1.2"/>

    <text x="24" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Live Dispatch &amp; Push Triggers</text>
    <text x="24" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Node.js Cloud Functions &bull; Firebase Push &bull; Redux Toolkit</text>

    <!-- Cloud Trigger Event 1 -->
    <g transform="translate(24, 85)">
      <rect width="425" height="74" rx="10" fill="#081017" stroke="#162939"/>
      <circle cx="34" cy="37" r="16" fill="#0ea5e9" fill-opacity="0.2"/>
      <text x="34" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">🔔</text>
      <text x="64" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Push Notification Dispatched</text>
      <text x="64" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">"Abebe is 2 minutes away with your lunch order!"</text>
      <text x="405" y="42" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">SENT &bull; 14ms</text>
    </g>

    <!-- In-App Messaging Feed -->
    <g transform="translate(24, 175)">
      <rect width="425" height="150" rx="10" fill="#081017" stroke="#162939"/>
      <text x="18" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">In-App Chat (Driver ⇄ Customer)</text>

      <!-- Message 1 -->
      <g transform="translate(18, 42)">
        <rect width="260" height="34" rx="8" fill="#162939"/>
        <text x="12" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">I've arrived at the gate entrance.</text>
      </g>

      <!-- Message 2 -->
      <g transform="translate(145, 86)">
        <rect width="260" height="34" rx="8" fill="#0284c7"/>
        <text x="12" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">Thanks! Coming down now. PIN: 4921</text>
      </g>
    </g>

    <!-- Technical Architecture Card -->
    <g transform="translate(24, 345)">
      <rect width="425" height="150" rx="12" fill="url(#foodAccent)" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="20" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Full-Stack Logistics Stack</text>
      <text x="20" y="56" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">&bull; React.js frontend with predictable Redux Toolkit global state</text>
      <text x="20" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">&bull; Node.js serverless functions trigger instant driver geofencing</text>
      <text x="20" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">&bull; Multi-role permission model protecting transaction settlement</text>
      <text x="20" y="128" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Engineered by Awol Ibrahim Ayalew</text>
    </g>
  </g>
</svg>
