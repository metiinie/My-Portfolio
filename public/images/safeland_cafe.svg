<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="cafeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b07"/>
      <stop offset="100%" stop-color="#24140b"/>
    </linearGradient>
    <linearGradient id="cafeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1a11" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#190e09" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cafeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="cafeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#cafeBg)"/>

  <!-- Subtle Warm Grid -->
  <g opacity="0.05" stroke="#fdba74" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="240" cy="240" r="180" fill="#f97316" opacity="0.12" filter="url(#cafeGlow)"/>
  <circle cx="1040" cy="480" r="190" fill="#facc15" opacity="0.08" filter="url(#cafeGlow)"/>

  <!-- Top App Navigation -->
  <rect x="70" y="50" width="1140" height="68" rx="14" fill="url(#cafeCard)" stroke="#452718" stroke-width="1.2"/>
  <circle cx="106" cy="84" r="7" fill="#ef4444"/>
  <circle cx="128" cy="84" r="7" fill="#f59e0b"/>
  <circle cx="150" cy="84" r="7" fill="#10b981"/>

  <text x="185" y="90" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">SAFELAND CAFE</text>
  <rect x="365" y="73" width="180" height="24" rx="12" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4"/>
  <text x="455" y="89" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">HAWASSA, ETHIOPIA</text>
  <text x="565" y="90" fill="#fed7aa" opacity="0.8" font-family="system-ui, sans-serif" font-size="14">Full-Stack QR Code Restaurant Ordering &amp; Real-time Operations</text>

  <!-- Left Column: Customer QR Mobile Experience & Menu -->
  <g transform="translate(70, 140)">
    <rect width="640" height="520" rx="16" fill="url(#cafeCard)" stroke="#452718" stroke-width="1.2"/>

    <!-- Mobile Device Mockup Frame -->
    <g transform="translate(30, 30)">
      <rect width="250" height="460" rx="28" fill="#090503" stroke="#5c331d" stroke-width="3"/>
      <!-- Speaker Notch -->
      <rect x="90" y="12" width="70" height="6" rx="3" fill="#2c1a11"/>

      <!-- Screen UI -->
      <rect x="12" y="32" width="226" height="414" rx="18" fill="#170c07"/>

      <!-- QR Header -->
      <text x="125" y="62" fill="#fdba74" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Table #14 &bull; Safeland</text>
      <text x="125" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Scan &bull; Order &bull; Enjoy</text>

      <!-- Menu Categories -->
      <g transform="translate(20, 95)">
        <rect width="60" height="22" rx="11" fill="#f97316"/>
        <text x="30" y="15" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Coffee</text>

        <rect x="66" width="60" height="22" rx="11" fill="#2c1a11"/>
        <text x="96" y="15" fill="#fdba74" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Pastry</text>

        <rect x="132" width="60" height="22" rx="11" fill="#2c1a11"/>
        <text x="162" y="15" fill="#fdba74" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Meals</text>
      </g>

      <!-- Menu Item 1 -->
      <g transform="translate(18, 130)">
        <rect width="190" height="64" rx="8" fill="#24140b" stroke="#3d2113"/>
        <rect x="10" y="10" width="44" height="44" rx="6" fill="#3d2113"/>
        <text x="32" y="36" fill="#fb923c" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">☕</text>
        <text x="62" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Sidama Special Roast</text>
        <text x="62" y="40" fill="#fdba74" font-family="system-ui, sans-serif" font-size="10">ETB 110.00</text>
        <rect x="150" y="32" width="30" height="22" rx="4" fill="#f97316"/>
        <text x="165" y="47" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">+</text>
      </g>

      <!-- Menu Item 2 -->
      <g transform="translate(18, 205)">
        <rect width="190" height="64" rx="8" fill="#24140b" stroke="#3d2113"/>
        <rect x="10" y="10" width="44" height="44" rx="6" fill="#3d2113"/>
        <text x="32" y="36" fill="#fb923c" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🥐</text>
        <text x="62" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Artisan Butter Croissant</text>
        <text x="62" y="40" fill="#fdba74" font-family="system-ui, sans-serif" font-size="10">ETB 140.00</text>
        <rect x="150" y="32" width="30" height="22" rx="4" fill="#f97316"/>
        <text x="165" y="47" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">+</text>
      </g>

      <!-- Order Active Bar -->
      <g transform="translate(18, 290)">
        <rect width="190" height="120" rx="10" fill="#24140b" stroke="#f97316"/>
        <text x="15" y="24" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11" font-weight="700">LIVE ORDER STATUS</text>
        <text x="15" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Order #SF-302</text>
        <text x="15" y="58" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Status: Brewing &bull; Est. 4 mins</text>
        <rect x="15" y="75" width="160" height="28" rx="6" fill="#f97316"/>
        <text x="95" y="93" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">View Bill / Re-Order</text>
      </g>
    </g>

    <!-- Details on right side of left column -->
    <g transform="translate(310, 40)">
      <text x="0" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Zero-Download QR Flow</text>
      <text x="0" y="48" fill="#fdba74" opacity="0.8" font-family="system-ui, sans-serif" font-size="13">Patrons scan dynamic QR code printed on cafe tables.</text>

      <g transform="translate(0, 80)">
        <circle cx="16" cy="16" r="16" fill="#f97316" fill-opacity="0.2"/>
        <text x="16" y="21" fill="#f97316" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">1</text>
        <text x="44" y="14" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Dynamic Table Association</text>
        <text x="44" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Table ID encrypted in URL query; prevents order mixups.</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="16" cy="16" r="16" fill="#f97316" fill-opacity="0.2"/>
        <text x="16" y="21" fill="#f97316" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">2</text>
        <text x="44" y="14" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">WebSocket Live Sync</text>
        <text x="44" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Instant kitchen ticket printing and waitstaff alerting.</text>
      </g>

      <g transform="translate(0, 220)">
        <circle cx="16" cy="16" r="16" fill="#f97316" fill-opacity="0.2"/>
        <text x="16" y="21" fill="#f97316" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">3</text>
        <text x="44" y="14" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Offline Resilience</text>
        <text x="44" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Menu cached on mobile; queues orders during drops.</text>
      </g>

      <g transform="translate(0, 310)">
        <rect width="300" height="110" rx="10" fill="#1a0e08" stroke="#3d2113"/>
        <text x="16" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Stack &amp; Production Metrics</text>
        <text x="16" y="50" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11">Next.js &bull; Node.js &bull; WebSockets &bull; PostgreSQL</text>
        <text x="16" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Active across 45 dining tables in Hawassa</text>
        <text x="16" y="94" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">35% Faster Table Turnover</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Kitchen & Staff Operational Dashboards -->
  <g transform="translate(735, 140)">
    <rect width="475" height="520" rx="16" fill="url(#cafeCard)" stroke="#452718" stroke-width="1.2"/>

    <text x="24" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Role-Based Real-Time Dashboards</text>
    <text x="24" y="66" fill="#fdba74" opacity="0.8" font-family="system-ui, sans-serif" font-size="12">Kitchen Display System (KDS) &bull; Waitstaff &bull; Management</text>

    <!-- Live KDS Ticket 1 -->
    <g transform="translate(24, 85)">
      <rect width="425" height="100" rx="10" fill="#140b06" stroke="#f97316" stroke-width="1.5"/>
      <rect x="0" y="0" width="8" height="100" fill="#f97316" rx="4"/>
      
      <text x="24" y="28" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11" font-weight="700">KITCHEN QUEUE &bull; TABLE #14</text>
      <text x="320" y="28" fill="#f97316" font-family="system-ui, sans-serif" font-size="12" font-weight="700">03:45 Elapsed</text>

      <text x="24" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">2x Sidama Roast (Extra Hot), 1x Croissant</text>
      <text x="24" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Server: Dawit M. &bull; Ticket #302</text>

      <rect x="330" y="55" width="80" height="28" rx="6" fill="#f97316"/>
      <text x="370" y="73" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">READY</text>
    </g>

    <!-- Live KDS Ticket 2 -->
    <g transform="translate(24, 200)">
      <rect width="425" height="100" rx="10" fill="#140b06" stroke="#3d2113" stroke-width="1"/>
      <rect x="0" y="0" width="8" height="100" fill="#3b82f6" rx="4"/>

      <text x="24" y="28" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BARISTA BAR &bull; TABLE #06</text>
      <text x="320" y="28" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="700">01:10 Elapsed</text>

      <text x="24" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">1x Iced Caramel Macchiato, 1x Tiramisu</text>
      <text x="24" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Server: Hana B. &bull; Ticket #303</text>

      <rect x="330" y="55" width="80" height="28" rx="6" fill="#3b82f6"/>
      <text x="370" y="73" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PREPARING</text>
    </g>

    <!-- Manager overview stats -->
    <g transform="translate(24, 320)">
      <rect width="425" height="170" rx="12" fill="url(#cafeAccent)" fill-opacity="0.1" stroke="#fb923c" stroke-width="1.2"/>
      <text x="20" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Manager Daily Summary</text>

      <g transform="translate(20, 50)">
        <text x="0" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total Orders</text>
        <text x="0" y="40" fill="#fdba74" font-family="system-ui, sans-serif" font-size="20" font-weight="800">318</text>

        <text x="130" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Average Ticket</text>
        <text x="130" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">ETB 265</text>

        <text x="260" y="16" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Avg Prep Time</text>
        <text x="260" y="40" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="800">6.2 mins</text>
      </g>

      <text x="20" y="132" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Role dashboards: Kitchen (tablet KDS), Waiters (mobile runner), Manager (financials).</text>
      <text x="20" y="152" fill="#fdba74" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Engineered by Awol Ibrahim Ayalew</text>
    </g>
  </g>
</svg>
